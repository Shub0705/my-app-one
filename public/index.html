<!DOCTYPE html>
<html>
<head>
    <title>DevOps App</title>
</head>
<body>
    <h1>DevOps Demo 🚀</h1>
    <button onclick="callApi()">Call API</button>
    <p id="result"></p>

    <script>
        function callApi() {
            fetch('/api')
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerText = data.message;
            });
        }
    </script>
</body>
</html>
